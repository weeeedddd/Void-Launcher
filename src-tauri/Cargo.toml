[package]
name = "void-launcher"
version = "0.1.4"
description = "A custom Minecraft launcher with Microsoft auth, CurseForge/Modrinth integration and a modpack builder."
edition = "2021"

# The lib name Tauri's mobile targets hook into; harmless on desktop.
[lib]
name = "void_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Opens URLs in the system browser (Microsoft login page, mod pages)
tauri-plugin-opener = "2"
# voidlauncher:// deep links (registered by the installer, see tauri.conf.json)
tauri-plugin-deep-link = "2"
# Forwards a second launch (e.g. a clicked deep link) into the running app
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Serialization — everything crossing the IPC boundary is serde camelCase
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client for all API calls (Microsoft/Xbox auth, Modrinth, CurseForge)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "time", "net", "io-util"] }

# Error handling
thiserror = "2"

# Instance ids, timestamps, download integrity
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha1_smol = "1"

# System diagnostics (CPU/RAM/disks) for the performance optimizer
sysinfo = "0.33"
# Java runtime management: SHA-256 verification + archive extraction
sha2 = "0.10"
base64 = "0.22"
url = "2"
zip = "2"
tar = "0.4"
flate2 = "1"
# Authenticated Minecraft installation/launch pipeline (vanilla + loaders).
# Tokens are supplied from our existing Rust-only Microsoft session and never
# cross the WebView boundary.
lyceris = "1.1.3"

[target.'cfg(windows)'.dependencies]
# Per-app GPU preference (Settings → Display → Graphics) via the registry
winreg = "0.52"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Threading"] }

[profile.release]
# Smaller, faster binaries for shipping
codegen-units = 1
lto = true
strip = true
