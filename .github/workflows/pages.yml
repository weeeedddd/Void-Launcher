name: Deploy website to GitHub Pages

# Why this exists:
# GitHub renders an .html file in the repo as SOURCE CODE, not as a web page —
# that's why opening website/index.html on github.com looks "just white/blank".
# This workflow publishes the website/ folder as a real GitHub Pages site,
# reachable at:  https://<owner>.github.io/<repo>/
#
# ONE-TIME SETUP (repo owner, once):
#   Repo → Settings → Pages → Build and deployment → Source: "GitHub Actions".
# After that this workflow deploys automatically on every push that touches
# website/, and can also be run manually from the Actions tab.

on:
  push:
    branches:
      - claude/minecraft-launcher-dev-3mp1k6
      - main
      - master
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

# Grant the token the permissions the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
